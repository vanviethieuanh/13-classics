[project]
name = "13-classics"
version = "0.1.0"
description = "Extract structured data from the 13 Chinese Classics (十三经)"
authors = [{ name = "accodius" }]
requires-python = ">=3.12"
dependencies = [
    "pymupdf>=1.25.0",
    "jieba>=0.42.1",
    "opencc-python-reimplemented>=0.1.7",
    "pydantic>=2.10.0",
    "typer>=0.15.0",
    "pyyaml>=6.0.2",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ipython>=8.0.0",
    "ruff>=0.5.0",
]
nlp = ["hanlp>=2.1.0"]

[project.scripts]
shisanjing = "shisanjing.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shisangjing"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
